<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="16" fill="url(#bgNet)"/>
  <!-- Network grid lines -->
  <g stroke="#065f46" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
    <line x1="0" y1="135" x2="960" y2="135"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="405" x2="960" y2="405"/>
  </g>
  <!-- Topology Connections -->
  <g stroke="#34d399" stroke-width="3" opacity="0.8">
    <line x1="220" y1="270" x2="380" y2="170"/>
    <line x1="220" y1="270" x2="380" y2="370"/>
    <line x1="380" y1="170" x2="580" y2="170"/>
    <line x1="380" y1="370" x2="580" y2="370"/>
    <line x1="380" y1="170" x2="580" y2="370"/>
    <line x1="580" y1="170" x2="740" y2="270"/>
    <line x1="580" y1="370" x2="740" y2="270"/>
  </g>
  <!-- Animated packet indicator -->
  <circle cx="480" cy="170" r="8" fill="#fef08a"/>
  <!-- Nodes -->
  <circle cx="220" cy="270" r="32" fill="#042f2e" stroke="url(#nodeGrad)" stroke-width="4"/>
  <text x="220" y="276" fill="#ecfdf5" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">SRC</text>

  <circle cx="380" cy="170" r="28" fill="#042f2e" stroke="url(#nodeGrad)" stroke-width="4"/>
  <text x="380" y="22" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">R1</text>

  <circle cx="380" cy="370" r="28" fill="#042f2e" stroke="url(#nodeGrad)" stroke-width="4"/>
  <text x="380" y="420" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">R2</text>

  <circle cx="580" cy="170" r="28" fill="#042f2e" stroke="url(#nodeGrad)" stroke-width="4"/>
  <text x="580" y="120" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">R3</text>

  <circle cx="580" cy="370" r="28" fill="#042f2e" stroke="url(#nodeGrad)" stroke-width="4"/>
  <text x="580" y="420" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">R4</text>

  <circle cx="740" cy="270" r="32" fill="#042f2e" stroke="url(#nodeGrad)" stroke-width="4"/>
  <text x="740" y="276" fill="#ecfdf5" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">DST</text>
</svg>
